name: DepSentry Autonomous CVE Watchdog

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cve-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python autonomous_runner.py
      - run: |
          git config user.name "DepSentry Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/cve_memory.json
          git diff --staged --quiet || git commit -m "chore(security): autonomous OSV CVE state update"
          git push
